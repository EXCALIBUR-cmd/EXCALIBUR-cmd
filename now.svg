<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">What I am up to right now</title>
<desc id="desc">Three cards. Building: live multiplayer canvases with real-time drawing over Socket.IO, chat and video over WebRTC, and AI-powered automation tools. Open to: full-stack and real-time systems, creative Three.js and WebGL work, and AI apps for real-world problems. Learning: advanced GLSL shader programming, system design at scale, and performance optimization.</desc>
<defs><filter id="soft" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="28"/></filter><clipPath id="cardClip"><rect x="1" y="1" width="382" height="298" rx="20"/></clipPath></defs>
<style>
.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', ui-monospace, Consolas, Menlo, monospace; }

.edge { animation: edge 7s linear infinite; }
@keyframes edge { to { stroke-dashoffset: -1333.7; } }
.ring { transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-out infinite; }
@keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
.slow { transform-box: fill-box; transform-origin: center; animation: slow 12s linear infinite; }
@keyframes slow { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
