<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Maninder Singh — Full-Stack Developer, Shader Wizard and 3D Artist</title>
<desc id="desc">Animated banner: the name Maninder Singh over a neon perspective grid, beside a glowing ringed shader planet. Subtitles cycle through Full-Stack Developer, Shader Wizard and 3D Artist, Three.js and WebGL Sorcerer, and Coder, Poet, Builder.</desc>
<defs>
<clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
<filter id="blur60" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="blur12" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="760" y2="0">
  <stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#B69CFF"/><stop offset="1" stop-color="#FF2E97"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#05060A" stop-opacity=".88"/><stop offset=".55" stop-color="#05060A" stop-opacity=".55"/><stop offset="1" stop-color="#05060A" stop-opacity="0"/>
</linearGradient>
<linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".7" stop-color="#fff"/></linearGradient>
<mask id="floor"><rect x="0" y="300" width="1200" height="120" fill="url(#floorFade)"/></mask>
<clipPath id="nameClip"><text class="sans" x="72" y="200" font-size="84" font-weight="800" letter-spacing="-2">Maninder Singh</text></clipPath>

<radialGradient id="pbase" cx="38%" cy="32%" r="75%">
  <stop offset="0" stop-color="#C4B5FD"/><stop offset=".35" stop-color="#7C3AED"/><stop offset=".75" stop-color="#2E1065"/><stop offset="1" stop-color="#0B0620"/>
</radialGradient>
<radialGradient id="pshade" cx="32%" cy="28%" r="85%">
  <stop offset=".45" stop-color="#05060A" stop-opacity="0"/><stop offset="1" stop-color="#05060A" stop-opacity=".9"/>
</radialGradient>
