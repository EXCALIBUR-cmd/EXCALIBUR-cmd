<style>
.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', ui-monospace, Consolas, Menlo, monospace; }

.tw { animation: tw 5s ease-in-out infinite; } @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }

.spin { transform-box: fill-box; transform-origin: center; animation: spin 90s linear infinite; }
.spinr { transform-box: fill-box; transform-origin: center; animation: spin 140s linear infinite reverse; }
.flow { animation: flow 4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flow { to { stroke-dashoffset: -192; } }
.b1 { animation: d1 18s ease-in-out infinite; } .b2 { animation: d2 22s ease-in-out infinite; } .b3 { animation: d1 26s ease-in-out infinite reverse; }
@keyframes d1 { 50% { transform: translate(70px, 30px); } }
@keyframes d2 { 50% { transform: translate(-80px, 40px); } }
.hl { animation: hl 4s cubic-bezier(.62, 0, 1, .55) infinite; }
@keyframes hl { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .75; } 100% { transform: translateY(120px); opacity: .9; } }
.sheen { animation: sheen 7s ease-in-out 1.2s infinite; }
@keyframes sheen { 0% { transform: translateX(0); } 38%, 100% { transform: translateX(1000px); } }
.ph { animation: ph 12s ease-in-out infinite backwards; }
@keyframes ph { 0% { opacity: 0; transform: translateY(8px); } 4%, 21% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-8px); } }
.caret { animation: caret 1s steps(1) infinite; } @keyframes caret { 50% { opacity: 0; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
