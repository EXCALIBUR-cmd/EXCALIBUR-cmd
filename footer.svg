<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Let's build something that moves</title>
<desc id="desc">Closing banner with neon aurora waves and the line: let us build something that moves. Thanks for stopping by.</desc>
<defs><clipPath id="card"><rect width="1200" height="260" rx="28"/></clipPath>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E97"/></linearGradient>
