.tw { animation: tw 5s ease-in-out infinite; } @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
.w1 { animation: w 14s linear infinite; } .w2 { animation: w 19s linear infinite reverse; } .w3 { animation: w 24s linear infinite; }
@keyframes w { to { transform: translateX(-600px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
